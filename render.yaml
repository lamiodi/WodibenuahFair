services:
  - type: web
    name: wodifair-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://wodibenuahfair.org
        sync: true
      - key: ADMIN_URL
        value: https://wodibenuahfair.org
        sync: true
      - key: EMAIL_FROM
        value: info@wodibenuahfair.org
        sync: true

  - type: static_site
    name: wodifair-app
    rootDir: wodifair-app
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
